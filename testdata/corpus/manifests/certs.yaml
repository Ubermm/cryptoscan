      algorithm: RSA
      key_size: 1024
      curve: ""
      signature_algorithm: SHA256-RSA
      spki_sha256: "e5aa885a8cd0eb2125f429ca1e447b7893743bcb9054edd5a92082cd20864e08"
      subject_cn: rsa1024.example.test
      self_signed: true
      expired: false
