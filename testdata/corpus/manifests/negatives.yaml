# cryptoscan corpus manifest fragment -- negative (false-positive-resistance)
# fixtures. DESIGN.md section 4: the scanner must emit ZERO findings of any
# class for every path listed here. The eval harness (section 3) treats any
# finding under negatives/ as a false positive.

version: 1
negatives:
  - id: neg-fake-cert-pem
    path: negatives/fake-cert.pem
    note: >-
      Well-formed PEM armor (BEGIN/END CERTIFICATE, 64-char base64 wrapping)
      whose body is base64 of lorem ipsum text -- decodes cleanly but is not
      valid DER, so no Certificate node may be created.

  - id: neg-truncated-pem
    path: negatives/truncated.pem
    note: >-
      BEGIN CERTIFICATE header plus roughly half the base64 body and no END
      footer. Incomplete PEM block; parser must not panic or emit a finding.

  - id: neg-plain-base64-blob
    path: negatives/blob.b64
    note: >-
      ~2KB of headerless base64 (deterministic source bytes). Looks like key
      material but has no PEM armor and is not a valid key/cert encoding.

  - id: neg-source-key-loader
    path: negatives/key_loader.py
    note: >-
      Python source with comments/strings mentioning RSA-2048, "BEGIN PRIVATE
      KEY", cipher names, and a variable holding fake base64. All decoy text.

  - id: neg-readme-prose
    path: negatives/README.md
    note: >-
      Markdown runbook discussing certificate rotation, TLS 1.0 deprecation,
      and cipher-suite names in prose only. No parseable assets.

  - id: neg-disabled-nginx-conf
    path: negatives/disabled-nginx.conf
    note: >-
      nginx-looking vhost with every ssl_* directive commented out. No active
      TLS directive, so zero tls_config findings expected.

  - id: neg-config-json
    path: negatives/config.json
    note: >-
      JSON with fields named "certificate" and "privateKey" holding fake
      base64 placeholders (not PEM/DER). Field names must not trigger findings.

  - id: neg-bogus-der
    path: negatives/notreallyder.der
    note: >-
      Binary file with a .der extension and a tempting 0x30 0x82 SEQUENCE-like
      prefix followed by deterministic junk bytes; not valid DER.

  - id: neg-prose-hostkey
    path: negatives/prose-hostkey.txt
    note: >-
      Prose whose first line leads with "HostKey" ("HostKey algorithms are
      important..."). Killed by sshd value-shape (value "algorithms" has no path
      separator) and structure (< 2 distinct sshd keywords).

  - id: neg-prose-ciphers
    path: negatives/prose-ciphers.md
    note: >-
      Markdown prose leading with "Ciphers" ("Ciphers used during World War
      II..."). Killed by sshd value-shape (a real Ciphers value is a single
      comma-list argument; this line has many words) and structure (< 2 sshd
      keywords).

  - id: neg-prose-macs
    path: negatives/prose-macs.txt
    note: >-
      Prose leading with "MACs" ("MACs are hardware network addresses."). Killed
      by sshd value-shape (multi-word value is not a single algorithm list) and
      structure (< 2 distinct sshd keywords).

  - id: neg-prose-kex
    path: negatives/prose-kex.rst
    note: >-
      reStructuredText prose leading with "KexAlgorithms". Killed by sshd
      value-shape (multi-word value) and structure (< 2 distinct sshd keywords).

  - id: neg-go-struct
    path: negatives/tls_config.go
    note: >-
      Go source with a struct whose fields are named Ciphers/MACs/HostKey. Three
      distinct sshd keywords appear, so structure passes, but NO crypto directive
      validates: "[]string" fails the algorithm-name charset (brackets) and
      "string" has no path separator, so the file is not claimed.

  - id: neg-python-settings
    path: negatives/settings.py
    note: >-
      Python class body with MinProtocol/CipherString attributes. Killed by
      openssl detection: "class TLS:" is not an INI [section] header (file has
      zero section headers) and the value is a quoted string, not an unquoted
      protocol token.

  - id: neg-gitconfig-tls
    path: negatives/weird.gitconfig
    note: >-
      Git config containing a real [tls] INI section with MinProtocol = TLSv1.
      Killed by the openssl pointer idiom: the [tls] section is not reachable
      from an openssl_conf root key (there is none), so MinProtocol is inert.
