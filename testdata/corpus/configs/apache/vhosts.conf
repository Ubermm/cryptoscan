# VirtualHost-heavy Apache file. Mostly non-TLS directives; exactly one
# TLS vhost so the parser must not be fooled by the surrounding noise.
# The one SSLProtocol here is "-all +TLSv1.2" -> enabled set { TLSv1.2 }.

ServerRoot "/etc/httpd"
Listen 80
Listen 443

LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so

# Plain HTTP vhost -- no TLS.
<VirtualHost *:80>
    ServerName www.example.com
    DocumentRoot "/var/www/html"
    RewriteEngine On
    RewriteRule ^/old/(.*)$ /new/$1 [R=301,L]
</VirtualHost>

# Second plain HTTP vhost -- reverse proxy, still no TLS.
<VirtualHost *:80>
    ServerName api.example.com
    ProxyPreserveHost On
    ProxyPass /        http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>

# The single TLS-terminating vhost.
<VirtualHost *:443>
    ServerName app.example.com
    DocumentRoot "/var/www/app"

    SSLEngine on
    SSLProtocol -all +TLSv1.2
    SSLCipherSuite ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    SSLCertificateFile    ../../certs/leaf-chain.pem
    SSLCertificateKeyFile ../../keys/rsa-2048.key
</VirtualHost>

# Status endpoint -- no TLS.
<VirtualHost *:80>
    ServerName status.example.com
    <Location "/server-status">
        SetHandler server-status
        Require local
    </Location>
</VirtualHost>
