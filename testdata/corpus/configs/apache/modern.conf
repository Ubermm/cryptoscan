# Modern Apache httpd TLS vhost.
# SSLProtocol "-all +TLSv1.2 +TLSv1.3" -> enabled set is exactly
# TLSv1.2, TLSv1.3.

Listen 443
LoadModule ssl_module modules/mod_ssl.so

<VirtualHost *:443>
    ServerName secure.example.com
    DocumentRoot "/var/www/secure"

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off

    # TLS 1.3 cipher preferences.
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

    SSLCertificateFile    ../../certs/ecdsa-p256.pem
    SSLCertificateKeyFile ../../keys/ecdsa-p256.key

    Header always set Strict-Transport-Security "max-age=63072000"

    <Directory "/var/www/secure">
        Require all granted
    </Directory>
</VirtualHost>
