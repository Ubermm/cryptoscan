# Legacy Apache httpd TLS vhost.
# SSLProtocol "all -SSLv3" -> under Apache 2.4 semantics the enabled set is
# TLSv1, TLSv1.1, TLSv1.2, TLSv1.3 (all = SSLv3..TLSv1.3, minus SSLv3).

ServerRoot "/etc/httpd"
Listen 443
LoadModule ssl_module modules/mod_ssl.so
LoadModule headers_module modules/mod_headers.so

ServerAdmin webmaster@example.com
ServerName legacy.example.com

<VirtualHost *:443>
    ServerName legacy.example.com
    DocumentRoot "/var/www/legacy"

    SSLEngine on
    SSLProtocol all -SSLv3
    SSLCipherSuite RC4-SHA:DES-CBC3-SHA:AES128-SHA:HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

    SSLCertificateFile    ../../certs/rsa-2048-selfsigned.pem
    SSLCertificateKeyFile ../../keys/rsa-2048.key

    <Directory "/var/www/legacy">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog "/var/log/httpd/legacy_error.log"
    CustomLog "/var/log/httpd/legacy_access.log" combined
</VirtualHost>
