# Legacy nginx TLS vhost -- intentionally weak for corpus testing.
# Exercises: multi-value ssl_protocols incl. TLS 1.0/1.1, RC4/3DES ciphers.

user  www-data;
worker_processes  auto;
pid /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain application/json;

    # Plain HTTP redirect -- no TLS here, parser should skip.
    server {
        listen 80;
        server_name legacy.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name legacy.example.com;

        # Weak on purpose: TLS 1.0 and 1.1 still enabled.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES128-SHA:RC4-SHA:DES-CBC3-SHA:AES128-SHA:HIGH:!aNULL:!MD5';
        ssl_prefer_server_ciphers on;

        ssl_certificate     ../../certs/rsa-2048-selfsigned.pem;
        ssl_certificate_key ../../keys/rsa-2048.key;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            root   /var/www/legacy;
            index  index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }
    }
}
