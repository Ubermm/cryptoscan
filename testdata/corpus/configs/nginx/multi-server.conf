# nginx with MULTIPLE server blocks each declaring different ssl_protocols.
# Manifest declares the UNION of protocols across all blocks for this file
# (DESIGN keys expectations per file); per-block detail noted below.

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Block A -- modern site: TLSv1.2 TLSv1.3
    server {
        listen 443 ssl;
        server_name a.example.com;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_certificate     ../../certs/rsa-2048-selfsigned.pem;
        ssl_certificate_key ../../keys/rsa-2048.key;

        location / { root /var/www/a; }
    }

    # Block B -- legacy site: TLSv1 TLSv1.1 TLSv1.2 (drags the union down)
    server {
        listen 8443 ssl;
        server_name b.example.com;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES128-SHA:AES128-SHA:HIGH:!aNULL';
        ssl_certificate     ../../certs/rsa-2048-selfsigned.pem;
        ssl_certificate_key ../../keys/rsa-2048.key;

        location / { root /var/www/b; }
    }

    # Block C -- plain HTTP, no TLS directives.
    server {
        listen 80;
        server_name c.example.com;
        location /health { return 200 "ok"; }
    }
}
