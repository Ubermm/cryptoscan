# Modern nginx TLS vhost -- TLS 1.2/1.3 only, strong ciphers, ECDSA leaf.

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Shared upstream, unrelated to TLS -- parser noise.
    upstream app_backend {
        server 10.0.0.11:9000;
        server 10.0.0.12:9000 backup;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name secure.example.com;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve X25519:secp384r1;

        ssl_certificate     ../../certs/ecdsa-p256.pem;
        ssl_certificate_key ../../keys/ecdsa-p256.key;

        add_header Strict-Transport-Security "max-age=63072000" always;

        ssl_stapling on;
        ssl_stapling_verify on;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
