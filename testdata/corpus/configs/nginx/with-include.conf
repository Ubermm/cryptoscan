# nginx vhost that splits TLS config across an included snippet.
# ssl_certificate / ssl_certificate_key live HERE; ssl_protocols and
# ssl_ciphers live in the included ssl-params.conf (its own asset).

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 443 ssl;
        server_name split.example.com;

        ssl_certificate     ../../certs/leaf-chain.pem;
        ssl_certificate_key ../../keys/rsa-2048.key;

        # Protocol/cipher policy pulled in from a shared snippet.
        include ssl-params.conf;

        location / {
            root  /var/www/split;
            index index.html;
        }
    }
}
