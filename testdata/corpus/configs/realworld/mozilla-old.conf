# Mozilla SSL Config generator, "old" profile (compat) -- deliberately weak.
server {
    listen 443 ssl;
    server_name compat.example.com;

    ssl_certificate     /etc/ssl/compat.crt;
    ssl_certificate_key /etc/ssl/compat.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:AES128-SHA:DES-CBC3-SHA;
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/dhparam.pem;        # Mozilla old = 1024-bit (weak DH)
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
}
