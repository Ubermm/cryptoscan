# Realistic h5bp-style deployment: server blocks pull TLS policy via include.
http {
    include       /etc/nginx/mime.types;

    server {
        listen [::]:443 ssl http2;
        listen 443 ssl http2;
        server_name secure.example.com;
        include inc/policy_strict.conf;      # TLSv1.2 TLSv1.3, X25519
        include inc/certificate_files.conf;  # default.crt/key; trusted/client are COMMENTED
    }

    server {
        listen 8443 ssl;
        server_name legacy-api.example.com;
        include inc/policy_balanced.conf;    # TLSv1.2 only
        ssl_certificate     /etc/nginx/certs/api.crt;
        ssl_certificate_key /etc/nginx/certs/api.key;
    }
}
