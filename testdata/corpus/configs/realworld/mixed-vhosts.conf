http {
    # modern public site
    server {
        listen 443 ssl;
        server_name www.example.com *.cdn.example.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate     /etc/ssl/www.crt;
        ssl_certificate_key /etc/ssl/www.key;
    }
    # legacy internal endpoint -- ONLY this one is weak
    server {
        listen 8443 ssl;
        server_name legacy.internal.example.com;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_certificate     /etc/ssl/legacy.crt;
        ssl_certificate_key /etc/ssl/legacy.key;
    }
    # plain HTTP redirect -- no TLS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://www.example.com$request_uri;
    }
}
