# Modern HAProxy config. Global ssl-default-bind-options disable SSLv3 and
# TLS 1.0/1.1; frontend binds present a pinned leaf chain via "ssl crt".
# Resolved enabled protocol set for this file: TLSv1.2, TLSv1.3
# (HAProxy base enable = TLSv1.0..TLSv1.3; no-tlsv10/no-tlsv11 remove the
#  lower two; no-sslv3 is a no-op since SSLv3 is off by default).

global
    log /dev/log local0
    maxconn 20000
    daemon

    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https_in
    bind :443 ssl crt ../../certs/leaf-chain.pem
    bind :8443 ssl crt ../../certs/leaf-chain.pem
    default_backend web_servers

backend web_servers
    balance roundrobin
    server web1 10.0.0.21:8080 check
    server web2 10.0.0.22:8080 check
