# Legacy HAProxy config. No no-tlsv10/no-tlsv11 options, so the full
# default range stays enabled.
# Resolved enabled protocol set for this file: TLSv1, TLSv1.1, TLSv1.2, TLSv1.3
# (HAProxy base enable = TLSv1.0..TLSv1.3; nothing removed here).

global
    log /dev/log local0
    maxconn 4000
    ssl-default-bind-ciphers ECDHE-RSA-AES128-SHA:AES128-SHA:DES-CBC3-SHA:HIGH:!aNULL

defaults
    mode http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend ft_web
    bind :80
    bind :443 ssl crt ../../certs/rsa-2048-selfsigned.pem
    default_backend bk_web

backend bk_web
    server app1 127.0.0.1:8080 check
