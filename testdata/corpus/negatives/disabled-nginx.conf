# nginx vhost with EVERY TLS directive commented out / disabled.
# This is a decoy: the scanner must report NO tls_config finding here,
# because no ssl_* directive is actually active.

server {
    listen 80;
    server_name disabled.example.com;

    # listen 443 ssl;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384';
    # ssl_certificate     /etc/nginx/ssl/example.pem;
    # ssl_certificate_key /etc/nginx/ssl/example.key;
    # ssl_prefer_server_ciphers on;

    location / {
        root  /var/www/disabled;
        index index.html;
    }

    # TODO: re-enable TLS once the cert is reissued (see runbook).
}
