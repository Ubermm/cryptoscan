# golangci-lint v2 configuration for cryptoscan.
# Run locally with: golangci-lint run
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gosec
    - misspell

  settings:
    govet:
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test files: relax rules that are noisy or irrelevant for tests.
      - path: _test\.go
        linters:
          - errcheck # ignored error returns are fine in tests
          - gosec    # e.g. weak-crypto fixtures, hardcoded test creds
          - revive   # exported-symbol doc requirements
      # ID-construction helpers legitimately format identifiers; keep concise.
      - path: internal/graph/
        text: "G115" # integer conversion (not used with untrusted sizes here)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
